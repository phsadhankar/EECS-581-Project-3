  OUTPUT:         Displays calculator results, saved history, and interface controls.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A scientific calculator that follows operator precedence and shows exactly where an expression went wrong."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Calculator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧮%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css?v=20261122m" />
  </head>
  <body>
    <div id="bg" aria-hidden="true"></div>
    <main>
      <label class="mode-switcher" for="modeSelect">
        <span class="mode-label">Mode</span>
        <select id="modeSelect" aria-label="Calculation mode">
          <option value="basic">Basic</option>
          <option value="scientific">Scientific</option>
          <option value="financial">Financial</option>
          <option value="conversion">Conversion</option>
          <option value="fraction">Fraction</option>
          <option value="programmer">Programmer</option>
          <option value="complex">Complex</option>
        </select>
      </label>

      <input
        id="expr"
        type="text"
        enterkeyhint="done"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        placeholder="0"
        aria-label="Expression"
      />

      <div id="out" aria-live="polite">0</div>
      <div id="msg" aria-live="polite"></div>

      <div id="converterPanel" hidden="">
        <select id="conversionCategory" aria-label="Conversion category">
          <option value="">Select a category</option>
          <option value="length">Length</option>
          <option value="mass">Mass / Weight</option>
          <option value="volume">Volume</option>
          <option value="temperature">Temperature</option>
          <option value="currency">Currency</option>
        </select>

        <input id="conversionValue" type="number" step="any" placeholder="Value" aria-label="Value to convert">

        <div id="conversionControls" hidden>

          <label for="fromUnit">From:</label>
          <select id="fromUnit"></select>

          <label for="toUnit">To:</label>
          <select id="toUnit"></select>
        </div>
        <button id="conversionCalculate" type="button">Calculate</button>
      </div>

        <section id="financialPanel" class="mode-panel" hidden>
          <div class="financial-field">
            <label for="financialPrincipal">Principal</label>
            <input id="financialPrincipal" type="number" min="0" step="any" placeholder="1000">
          </div>
          <div class="financial-field">
            <label for="financialRate">Annual rate (%)</label>
            <input id="financialRate" type="number" min="0" step="any" placeholder="5 (%)">
          </div>
          <div class="financial-field">
            <label for="financialYears">Years</label>
            <input id="financialYears" type="number" min="0" step="any" placeholder="2">
          </div>
          <div class="financial-field">
            <label for="financialFrequency">Compounds/year</label>
            <input id="financialFrequency" type="number" min="1" step="1" placeholder="12">
          </div>
          <button id="financialCalculate" type="button">Calculate</button>
        </section>

        <section id="fractionPanel" class="mode-panel" hidden>
          <div id="fractionArithmetic" class="fraction-arithmetic">
            <input id="fractionA" aria-label="First fraction" placeholder="1/2">
            <select id="fractionOperator" aria-label="Fraction operation">
              <option value="" selected disabled>Operation</option>
              <option value="+">+</option><option value="-">−</option>
              <option value="*">×</option><option value="/">÷</option>
              <option value="convert">Convert</option>
            </select>
            <input id="fractionB" aria-label="Second fraction" placeholder="1/3">
          </div>
          <button id="fractionCalculate" type="button">Calculate</button>
        </section>

        <section id="programmerPanel" class="mode-panel" hidden>
          <select id="programmerBase" aria-label="Input base">
            <option value="" selected disabled>Base</option>
            <option value="10">Decimal</option>
            <option value="2">Binary</option>
            <option value="16">Hexadecimal</option>
          </select>
          <div id="programmerOperationRow" class="programmer-operation-row">
            <input id="programmerInput" aria-label="Programmer first value" placeholder="1010">
            <select id="programmerOperation" aria-label="Bitwise operation">
              <option value="" selected disabled>Operation</option>
              <option value="none">Convert</option><option value="and">AND</option>
              <option value="or">OR</option><option value="xor">XOR</option>
            </select>
            <input id="programmerOperand" aria-label="Bitwise operand" placeholder="1100" hidden>
          </div>
          <button id="programmerCalculate" type="button">Calculate</button>
        </section>

        <section id="complexPanel" class="mode-panel" hidden>
          <input id="complexInput" aria-label="Complex expression" placeholder="(1+2i)+(3-i)">
          <button id="complexCalculate" type="button">Calculate</button>
        </section>

      <div class="keys sci">
        <button data-k="sin(">sin</button>
        <button data-k="cos(">cos</button>
        <button data-k="tan(">tan</button>
        <button data-k="π">π</button>
        <button data-k="ln(">ln</button>
        <button data-k="log(">log</button>
        <button data-k="sqrt(">√</button>
        <button data-k="^">xʸ</button>
        <button data-k="(">(</button>
        <button data-k=")">)</button>
        <button data-k="abs(">abs</button>
        <button data-k="e">e</button>
        <button data-k="Ans" class="op">Ans</button>      <!-- Requirement 03: Ans button -->
        <button data-a="converter" class="op">unit</button>
        <button id="FuncToggle" class="op">func</button>  <!-- Func Button -->
      </div>

      <div id="basicKeys" class="keys">
        <button data-a="clear" class="op">AC</button>
        <button data-a="back" class="op" aria-label="Delete">⌫</button>
        <button
          data-a="angle"
          class="op"
          id="angle"
          aria-label="Angle unit: radians. Press to switch to degrees."
        >
          Rad
        </button>
        <button data-k="÷" class="op">÷</button>
        <button data-k="7">7</button>
        <button data-k="8">8</button>
        <button data-k="9">9</button>
        <button data-k="×" class="op">×</button>
        <button data-k="4">4</button>
        <button data-k="5">5</button>
        <button data-k="6">6</button>
        <button data-k="−" class="op">−</button>
        <button data-k="1">1</button>
        <button data-k="2">2</button>
        <button data-k="3">3</button>
        <button data-k="+" class="op">+</button>
        <button data-k="0" class="wide">0</button>
        <button data-k=".">.</button>
        <button data-a="eq" class="eq">=</button>
      </div>

      <!-- Requirement 03: Saved calculation history -->
      <details id="historyPanel" class="history-panel">
      <summary>Calculation history</summary>
      
      <!-- Requirement 03: Controls for managing saved calculations. -->
      <!-- Requirement 23: Export Calculation History -->
      <div class="history-actions">
        <!-- Requirement 23: Download history as a text file -->
        <button id="exportTXT" type="button">
          Export TXT
        </button>

        <!-- Requirement 23: Download history as a CSV file -->
        <button id="exportCSV" type="button">
          Export CSV
        </button>

        <!-- Requirement 03: Button to clear history -->  
        <button id="clearHistory" type="button">
          Clear History
        </button>
      </div>

      <!-- Requirement 23: Show messages about exporting -->
      <p id="exportMessage" role="status" aria-live="polite"></p>

      <!-- Requirement 03: Displayed when no calculations have been saved. -->
      <p id="historyEmpty">
        No calculations yet.
      </p>

      <!-- Requirement 03: Adds the saved calculation entries to this list. -->
      <ol id="historyList"></ol>
      </details>
      
      <details id="steps" hidden>
        <summary>Show steps</summary>
        <ol id="stepList"></ol>
      </details>
    </main>

    <!-- Functions Side Menu -->

    <aside id="sideMenu" class="side-menu">

      <!-- Title -->
      <div class="side-menu-header">
        <h2>Functions</h2>
      </div>

      <!-- Category Filter -->
      <div class="side-menu-content">
        <div class="menu-controls">
          <select id="categoryFilter" aria-label="Filter by category">
            <option value="all">All Categories</option>
          </select>
        
        <!-- Search Bar-->
        <input
          type="text"
          id="functionSearch"
          placeholder="Search..."
          aria-label="Search functions"
          autocomplete="off"
        />
        </div>

        <!-- List of Functions-->
        <div id="functionList"></div>
      </div>
    </aside>

    <noscript>This calculator needs JavaScript.</noscript>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="./functions.js?v=20261122m"></script>
    <script src="./script.js?v=20261122m"></script>
  </body>
</html>
